# meta ========================================================================

# enable build config validation
version: ~> 1.0

# save Travis budget
if: branch = main

# report outcomes
notifications:
  email:
    on_success: change
    on_failure: always


# default jobs: Linux, all Python versions ====================================

os: linux
dist: focal
arch: arm64
virt: lxd
language: generic

env:
  global:
    # limit procs to available cores
    - TOX_JOBS=2
  jobs:
    - PYTHON=3.14
    - PYTHON=3.13
    - PYTHON=3.12
    - PYTHON=3.11
    - PYTHON=3.10

before_install:
 - export ARCH=Linux-aarch64
 - sudo apt-get -y install pandoc

install:
  - | # install uv and add to PATH
    travis_retry wget -qO- https://astral.sh/uv/install.sh | env UV_UNMANAGED_INSTALL="${HOME}/.local/bin" sh
    export PATH="${HOME}/.local/bin:${PATH}"; hash -r

script:
  - | # create and activate virtual environment
    uv venv --python ${PYTHON}
    source .venv/bin/activate
  - | # install pyunicorn and python libs by synching environment with pyproject.toml
    uv sync --group test --group docs --group ci
  - | # run test suite
    tox -v

# report statistics
after_success: codecov

# modified job: Windows, newest Python version ================================
# (inherit only 1st `env.jobs` entry)

jobs:
  fast_finish: true
  include:
    - os: windows
      language: shell
      before_install:
        - export ARCH=Windows-x86_64
      install:
        - | # install uv
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
          powershell $env:Path = "C:\Users\travis\.local\bin;$env:Path"
        - | # install executables via chocolatey: pandoc
          travis_retry choco install pandoc
